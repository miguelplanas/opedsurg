# Required check for auto-merge: PRs touching data, auth, CI or deleting app
# code wait for the ok-miguel label. See miguelplanas/ci.
name: guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  guard:
    permissions:
      pull-requests: read
      statuses: write
    uses: miguelplanas/ci/.github/workflows/guard.yml@main
    with:
      # Extra sensitive paths for this app, one ERE per line.
      extra: |
        ^data/
        ^web/public/data/
        ^web/worker/
