name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test

  # Fusionar es desplegar: el Worker "opedsurg" de Cloudflare, cuando test está en verde.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      # Un pipeline verde tiene que querer decir que está en vivo.
      - name: Check it is live
        run: |
          for i in 1 2 3 4 5 6; do
            # || true: el shell de Actions corta al primer fallo, y un nombre
            # recién creado puede no resolver aún (curl sale con 6).
            code=$(curl -s -o /dev/null -w '%{http_code}' https://opedsurg.miguelplanas.dev/login || true)
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::https://opedsurg.miguelplanas.dev/login no responde 200 (último: $code)"
          exit 1
